<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Offbeat 수학 센터</title>
    <style>
        body { font-family: 'Pretendard', sans-serif; max-width: 450px; margin: 0 auto; padding: 20px; background: #f8f9fa; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
        h1 { color: #007BFF; font-size: 1.3rem; text-align: center; border-bottom: 2px solid #007BFF; padding-bottom: 10px; }
        
        /* 탭 메뉴 디자인 */
        .tab-menu { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn { flex: 1; padding: 12px; border: none; border-radius: 8px; cursor: pointer; background: #e9ecef; font-weight: bold; transition: 0.3s; }
        .tab-btn.active { background: #007BFF; color: white; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        input[type="text"] { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; margin-bottom: 15px; }
        .file-label { display: block; background: #007BFF; color: white; text-align: center; padding: 15px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        #preview-container { display: none; margin: 15px 0; }
        #preview-img { width: 100%; border-radius: 8px; border: 2px solid #007BFF; }
        
        .submit-btn { width: 100%; background: #28a745; color: white; border: none; padding: 15px; border-radius: 6px; font-size: 1.1rem; font-weight: bold; cursor: pointer; margin-top: 10px; transition: 0.3s; }
        .submit-btn:disabled { background: #ccc; cursor: not-allowed; }
        
        /* 결과 리스트 디자인 */
        .result-item { border: 1px solid #eee; padding: 15px; border-radius: 8px; margin-bottom: 15px; background: #fff; }
        .result-date { font-size: 0.8rem; color: #888; margin-bottom: 5px; }
        .result-feedback { font-size: 0.95rem; line-height: 1.6; white-space: pre-wrap; color: #333; }
        .result-img { width: 100%; border-radius: 6px; margin-top: 10px; border: 1px solid #eee; }
        #status { margin-top: 10px; text-align: center; font-size: 0.9rem; font-weight: bold; color: #555; }
    </style>
</head>
<body>

    <h1>Project Offbeat 수학 센터</h1>

    <div class="tab-menu">
        <button class="tab-btn active" onclick="openTab('upload')">과제 제출</button>
        <button class="tab-btn" onclick="openTab('results')">결과 조회</button>
    </div>

    <div id="upload" class="tab-content active">
        <div class="card">
            <p style="text-align:center; font-weight:bold; margin-bottom: 15px;">[오늘의 과제] 1968년 을지로 수학 문제</p>
            <input type="text" id="student-name" placeholder="학생 이름을 입력하세요">
            <input type="text" id="student-id" placeholder="학번/아이디 (결과 조회 시 필요)">
            <label class="file-label">
                <input type="file" id="photo" accept="image/*" capture="camera" style="display:none;" onchange="previewFile()">
                📸 사진 찍기 / 파일 선택
            </label>
            <div id="preview-container"><img id="preview-img" src=""></div>
            <button class="submit-btn" onclick="uploadData()" id="submit-btn">과제 제출하기</button>
            <div id="status"></div>
        </div>
    </div>

    <div id="results" class="tab-content">
        <div class="card">
            <input type="text" id="search-id" placeholder="등록한 아이디를 입력하세요">
            <button class="submit-btn" onclick="fetchResults()" style="background:#007BFF;">내 결과 조회하기</button>
            <div id="result-list" style="margin-top:20px;"></div>
        </div>
    </div>

    <script>
        // [필수] 사장님의 구글 앱스 스크립트 '새 배포' URL을 아래에 넣으세요.
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwFgy_p_zQZPe3E4waNbmBgaqramByCLIlZBD9UnNuMZN7o_uTkneuqwNk2QnO8gh8h/exec";

        // 탭 전환 함수
        function openTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tabName).classList.add('active');
            event.currentTarget.classList.add('active');
        }

        // 사진 미리보기
        function previewFile() {
            const file = document.getElementById('photo').files[0];
            const preview = document.getElementById('preview-img');
            const container = document.getElementById('preview-container');
            if (file) {
                const reader = new FileReader();
                reader.onload = e => { preview.src = e.target.result; container.style.display = 'block'; };
                reader.readAsDataURL(file);
            }
        }

        // [과제 제출] 로직
        function uploadData() {
            const name = document.getElementById('student-name').value;
            const studentId = document.getElementById('student-id').value;
            const fileInput = document.getElementById('photo');
            const status = document.getElementById('status');
            const btn = document.getElementById('submit-btn');

            // 이번 문제의 정답 데이터 (제미나이가 참고할 내용)
            const targetAnswer = "문제 1번 정답: 200 / 문제 2번 정답: 가, 다(4번)";

            if (!name || !studentId || fileInput.files.length === 0) {
                return alert("이름, 아이디, 사진을 모두 확인해주세요.");
            }

            btn.disabled = true;
            status.innerHTML = "⏳ 전송 중... (약 3초)";

            const file = fileInput.files[0];
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.src = e.target.result;
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    
                    // 이미지 최적화 (가로 1200px 기준)
                    const TARGET_WIDTH = 1200; 
                    let width = img.width, height = img.height;
                    if (width > TARGET_WIDTH) { height *= TARGET_WIDTH / width; width = TARGET_WIDTH; }
                    canvas.width = width; canvas.height = height;
                    ctx.drawImage(img, 0, 0, width, height);
                    
                    const base64 = canvas.toDataURL('image/jpeg', 0.8).split(',')[1];

                    // 서버로 보낼 데이터 구성
                    const payload = {
                        name: name,
                        studentId: studentId,
                        base64: base64,
                        answer: targetAnswer
                    };

                    fetch(WEB_APP_URL, { 
                        method: "POST", 
                        body: JSON.stringify(payload) 
                    })
                    .then(res => res.text())
                    .then(() => {
                        status.innerHTML = "✅ 제출 성공! 잠시 후 결과 탭에서 확인하세요.";
                        document.getElementById('photo').value = "";
                        document.getElementById('preview-container').style.display = 'none';
                        btn.disabled = false;
                    })
                    .catch(err => { 
                        status.innerText = "❌ 전송 실패"; 
                        btn.disabled = false; 
                        console.error(err);
                    });
                };
            };
            reader.readAsDataURL(file);
        }

        // [결과 조회] 로직
        function fetchResults() {
            const searchId = document.getElementById('search-id').value;
            const resultList = document.getElementById('result-list');
            
            if (!searchId) return alert("아이디를 입력하세요.");
            
            resultList.innerHTML = "⏳ 선생님의 힌트를 불러오는 중...";
            
            // GET 방식으로 학생 아이디 전송 (구글 스크립트의 doGet 호출)
            fetch(`${WEB_APP_URL}?studentId=${searchId}`)
            .then(res => res.json())
            .then(data => {
                if (!data || data.length === 0) {
                    resultList.innerHTML = "조회된 결과가 없습니다. 학번을 다시 확인해주세요.";
                    return;
                }
                
                // 최신 제출본이 위로 오도록 역순 출력
                resultList.innerHTML = data.reverse().map(item => `
                    <div class="result-item">
                        <div class="result-date">${item.date}</div>
                        <div class="result-feedback">${item.feedback}</div>
                        <img src="${item.imageUrl}" class="result-img">
                    </div>
                `).join('');
            })
            .catch(err => {
                resultList.innerHTML = "❌ 조회 중 오류가 발생했습니다.";
                console.error(err);
            });
        }
    </script>
</body>
</html>
