<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>수학 과제 지원 센터</title>
    <style>
        body { font-family: 'Pretendard', sans-serif; max-width: 450px; margin: 0 auto; padding: 20px; background: #f8f9fa; color: #333; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
        h1 { color: #007BFF; font-size: 1.4rem; text-align: center; border-bottom: 2px solid #007BFF; padding-bottom: 10px; margin-bottom: 20px; }
        .tab-menu { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn { flex: 1; padding: 12px; border: 1px solid #ddd; border-radius: 8px; cursor: pointer; background: #fff; font-weight: bold; transition: 0.3s; }
        .tab-btn.active { background: #007BFF; color: white; border-color: #007BFF; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        input[type="text"] { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; margin-bottom: 15px; }
        .file-label { display: block; background: #6c757d; color: white; text-align: center; padding: 15px; border-radius: 6px; cursor: pointer; font-weight: bold; margin-bottom: 10px; }
        #preview-container { display: none; margin: 15px 0; }
        #preview-img { width: 100%; border-radius: 8px; border: 1px solid #ddd; }
        .submit-btn { width: 100%; background: #28a745; color: white; border: none; padding: 15px; border-radius: 6px; font-size: 1.1rem; font-weight: bold; cursor: pointer; }
        .result-item { border-bottom: 1px solid #eee; padding: 15px 0; }
        .result-feedback { font-size: 0.95rem; line-height: 1.6; white-space: pre-wrap; color: #333; }
        .result-img { width: 100%; border-radius: 6px; margin-top: 10px; }
        #status { margin-top: 15px; text-align: center; font-weight: bold; color: #007BFF; }
    </style>
</head>
<body>
    <h1>수학 과제 지원 센터</h1>
    <div class="tab-menu">
        <button class="tab-btn active" onclick="openTab('upload')">과제 제출</button>
        <button class="tab-btn" onclick="openTab('results')">결과 조회</button>
    </div>
    <div id="upload" class="tab-content active">
        <div class="card">
            <input type="text" id="student-name" placeholder="학생 이름을 입력하세요">
            <input type="text" id="student-id" placeholder="학번/아이디 입력">
            <label class="file-label">
                <input type="file" id="photo" accept="image/*" capture="camera" style="display:none;" onchange="previewFile()">
                📸 풀이 사진 촬영
            </label>
            <div id="preview-container"><img id="preview-img" src=""></div>
            <button class="submit-btn" onclick="uploadData()" id="submit-btn">과제 제출하기</button>
            <div id="status"></div>
        </div>
    </div>
    <div id="results" class="tab-content">
        <div class="card">
            <input type="text" id="search-id" placeholder="학번/아이디 입력">
            <button class="submit-btn" onclick="fetchResults()" style="background:#007BFF;">내 결과 조회하기</button>
            <div id="result-list" style="margin-top:20px;"></div>
        </div>
    </div>
    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwKFoplEGeS6NhwWyReimFA3dlGLmVm8MPXOUS5X-xGZoaPifg7j-7qXO6exK93_Riz0Q/exec";

        function openTab(name) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(name).classList.add('active');
            event.currentTarget.classList.add('active');
        }

        function previewFile() {
            const file = document.getElementById('photo').files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = e => { 
                    document.getElementById('preview-img').src = e.target.result; 
                    document.getElementById('preview-container').style.display = 'block'; 
                };
                reader.readAsDataURL(file);
            }
        }

        function uploadData() {
            const name = document.getElementById('student-name').value;
            const studentId = document.getElementById('student-id').value;
            const fileInput = document.getElementById('photo');
            const status = document.getElementById('status');
            const btn = document.getElementById('submit-btn');

            if (!name || !studentId || fileInput.files.length === 0) return alert("항목을 모두 확인해주세요.");

            btn.disabled = true;
            status.innerHTML = "⏳ 이미지 처리 중...";

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.src = e.target.result;
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');

                    const MAX_WIDTH = 1200; 
                    let w = img.width;
                    let h = img.height;

                    if (w > MAX_WIDTH) {
                        h *= MAX_WIDTH / w;
                        w = MAX_WIDTH;
                    }

                    canvas.width = w;
                    canvas.height = h;
                    ctx.drawImage(img, 0, 0, w, h);
                    
                    const base64 = canvas.toDataURL('image/jpeg', 0.6).split(',')[1];

                    status.innerHTML = "⏳ 전송 중...";

                    // --- 수정된 통신 섹션 ---
                    fetch(WEB_APP_URL, { 
                        method: "POST", 
                        headers: {
                            "Content-Type": "text/plain;charset=utf-8"
                        },
                        body: JSON.stringify({ name: name, studentId: studentId, base64: base64 }),
                        redirect: "follow" 
                    })
                    .then(res => res.text())
                    .then(txt => {
                        if(txt === "Success") {
                            status.innerHTML = "✅ 제출 성공! 잠시 후 결과를 확인하세요.";
                        } else {
                            status.innerHTML = "❌ 서버 에러: " + txt;
                        }
                        btn.disabled = false;
                    })
                    .catch(err => { 
                        console.error(err);
                        status.innerText = "❌ 네트워크 오류"; 
                        btn.disabled = false;
                    });
                    // -----------------------
                };
            };
            reader.readAsDataURL(fileInput.files[0]);
        }

        function fetchResults() {
            const id = document.getElementById('search-id').value;
            const list = document.getElementById('result-list');
            if (!id) return alert("아이디를 입력하세요.");
            list.innerHTML = "⏳ 조회 중...";
            fetch(`${WEB_APP_URL}?studentId=${id}`)
            .then(res => res.json())
            .then(data => {
                if (!data || data.length === 0) { list.innerHTML = "기록이 없습니다."; return; }
                list.innerHTML = data.map(item => `
                    <div class="result-item">
                        <div class="result-date">${item.date}</div>
                        <div class="result-feedback">${item.feedback}</div>
                        <img src="${item.imageUrl}" class="result-img">
                    </div>
                `).join('');
            });
        }
    </script>
</body>
</html>
