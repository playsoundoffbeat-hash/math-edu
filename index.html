<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>수학 과제 제출 센터</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.0/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.0/dist/katex.min.js"></script>
    <style>
        body { font-family: 'Pretendard', sans-serif; max-width: 450px; margin: 0 auto; padding: 20px; background: #f8f9fa; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
        h1 { color: #007BFF; font-size: 1.3rem; text-align: center; border-bottom: 2px solid #007BFF; padding-bottom: 10px; }
        .problem { background: #fff; padding: 15px; border: 1px solid #eee; border-radius: 8px; margin: 15px 0; text-align: center; }
        input[type="text"] { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; margin-bottom: 15px; }
        .file-label { display: block; background: #007BFF; color: white; text-align: center; padding: 15px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        #preview-container { display: none; margin: 15px 0; }
        #preview-img { width: 100%; border-radius: 8px; border: 2px solid #007BFF; }
        .submit-btn { width: 100%; background: #28a745; color: white; border: none; padding: 15px; border-radius: 6px; font-size: 1.1rem; font-weight: bold; cursor: pointer; }
        .submit-btn:disabled { background: #ccc; }
        .reset-btn { width: 100%; background: #6c757d; color: white; border: none; padding: 12px; border-radius: 6px; margin-top: 10px; display: none; cursor: pointer; }
        #status { margin-top: 15px; text-align: center; font-weight: bold; color: #555; }
    </style>
</head>
<body>
    <div class="card">
        <h1>오늘의 과제</h1>
        <div class="problem">\(x^2 - 5x + 6 = 0\) 풀이를 제출하세요.</div>
    </div>
    <div class="card">
        <input type="text" id="student-name" placeholder="학생 이름을 입력하세요">
        <label class="file-label">
            <input type="file" id="photo" accept="image/*" capture="camera" style="display:none;" onchange="previewFile()">
            📸 사진 찍기 / 확인
        </label>
        <div id="preview-container"><img id="preview-img" src=""></div>
        <button class="submit-btn" onclick="uploadData()" id="submit-btn">과제 제출하기</button>
        <button class="reset-btn" onclick="resetForm()" id="reset-btn">🔄 추가 제출하기</button>
        <div id="status"></div>
    </div>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwFgy_p_zQZPe3E4waNbmBgaqramByCLIlZBD9UnNuMZN7o_uTkneuqwNk2QnO8gh8h/exec";

        function previewFile() {
            const file = document.getElementById('photo').files[0];
            const preview = document.getElementById('preview-img');
            const container = document.getElementById('preview-container');
            if (file) {
                const reader = new FileReader();
                reader.onload = e => { preview.src = e.target.result; container.style.display = 'block'; };
                reader.readAsDataURL(file);
            }
        }

        function resetForm() {
            document.getElementById('photo').value = "";
            document.getElementById('preview-container').style.display = 'none';
            document.getElementById('status').innerText = "";
            document.getElementById('submit-btn').style.display = 'block';
            document.getElementById('submit-btn').disabled = false;
            document.getElementById('reset-btn').style.display = 'none';
        }

        function uploadData() {
            const name = document.getElementById('student-name').value;
            const fileInput = document.getElementById('photo');
            const status = document.getElementById('status');
            const btn = document.getElementById('submit-btn');

            if (!name || fileInput.files.length === 0) return alert("이름과 사진을 확인해주세요.");

            btn.disabled = true;
            status.innerHTML = "⏳ 최적화 전송 중... (약 3초)";

            const file = fileInput.files[0];
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.src = e.target.result;
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    const TARGET_WIDTH = 1600; 
                    let width = img.width, height = img.height;
                    if (width > TARGET_WIDTH) { height *= TARGET_WIDTH / width; width = TARGET_WIDTH; }
                    canvas.width = width; canvas.height = height;
                    ctx.drawImage(img, 0, 0, width, height);
                    
                    const base64 = canvas.toDataURL('image/jpeg', 0.7).split(',')[1];
                    fetch(WEB_APP_URL, { method: "POST", body: JSON.stringify({ name: name, base64: base64 }) })
                    .then(() => {
                        status.innerHTML = "✅ 제출 성공!";
                        btn.style.display = 'none';
                        document.getElementById('reset-btn').style.display = 'block';
                    }).catch(() => { status.innerText = "❌ 전송 실패"; btn.disabled = false; });
                };
            };
            reader.readAsDataURL(file);
        }
    </script>
</body>
</html>
