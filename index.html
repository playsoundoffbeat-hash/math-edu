<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>수학 과제 제출 & 결과 조회</title>
    <style>
        body { font-family: 'Pretendard', sans-serif; max-width: 450px; margin: 0 auto; padding: 20px; background: #f8f9fa; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
        h1 { color: #007BFF; font-size: 1.3rem; text-align: center; border-bottom: 2px solid #007BFF; padding-bottom: 10px; }
        
        /* 탭 스타일 */
        .tab-menu { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn { flex: 1; padding: 12px; border: none; border-radius: 8px; cursor: pointer; background: #e9ecef; font-weight: bold; }
        .tab-btn.active { background: #007BFF; color: white; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        input[type="text"] { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; margin-bottom: 15px; }
        .file-label { display: block; background: #007BFF; color: white; text-align: center; padding: 15px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        #preview-container { display: none; margin: 15px 0; }
        #preview-img { width: 100%; border-radius: 8px; border: 2px solid #007BFF; }
        .submit-btn { width: 100%; background: #28a745; color: white; border: none; padding: 15px; border-radius: 6px; font-size: 1.1rem; font-weight: bold; cursor: pointer; margin-top: 10px; }
        
        /* 결과 리스트 스타일 */
        .result-item { border: 1px solid #eee; padding: 15px; border-radius: 8px; margin-bottom: 15px; background: #fff; }
        .result-date { font-size: 0.8rem; color: #888; margin-bottom: 5px; }
        .result-feedback { font-size: 0.95rem; line-height: 1.5; white-space: pre-wrap; color: #333; }
        .result-img { width: 100%; border-radius: 6px; margin-top: 10px; border: 1px solid #eee; }
    </style>
</head>
<body>

    <h1>Project Offbeat 수학 센터</h1>

    <div class="tab-menu">
        <button class="tab-btn active" onclick="openTab('upload')">과제 제출</button>
        <button class="tab-btn" onclick="openTab('results')">결과 조회</button>
    </div>

    <div id="upload" class="tab-content active">
        <div class="card">
            <p style="text-align:center; font-weight:bold;">[오늘의 과제] 연립방정식 활용 문제</p>
            <input type="text" id="student-name" placeholder="이름 (예: 홍길동)">
            <input type="text" id="student-id" placeholder="학번/아이디 (결과 조회용)">
            <label class="file-label">
                <input type="file" id="photo" accept="image/*" capture="camera" style="display:none;" onchange="previewFile()">
                📸 사진 찍기 / 확인
            </label>
            <div id="preview-container"><img id="preview-img" src=""></div>
            <button class="submit-btn" onclick="uploadData()" id="submit-btn">과제 제출하기</button>
            <div id="status" style="margin-top:10px; text-align:center; font-size:0.9rem;"></div>
        </div>
    </div>

    <div id="results" class="tab-content">
        <div class="card">
            <input type="text" id="search-id" placeholder="내 아이디를 입력하세요">
            <button class="submit-btn" onclick="fetchResults()" style="background:#007BFF;">내 결과 조회하기</button>
            <div id="result-list" style="margin-top:20px;"></div>
        </div>
    </div>

    <script>
        // 사장님의 구글 앱스 스크립트 배포 URL로 교체하세요
        const WEB_APP_URL = "여기에_새로_배포한_GAS_URL을_넣으세요";

        function openTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tabName).classList.add('active');
            event.currentTarget.classList.add('active');
        }

        function previewFile() {
            const file = document.getElementById('photo').files[0];
            const preview = document.getElementById('preview-img');
            const container = document.getElementById('preview-container');
            if (file) {
                const reader = new FileReader();
                reader.onload = e => { preview.src = e.target.result; container.style.display = 'block'; };
                reader.readAsDataURL(file);
            }
        }
