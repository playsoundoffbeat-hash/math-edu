<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>수학 학습 지원 센터</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.0/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.0/dist/katex.min.js"></script>
    <style>
        body { font-family: 'Pretendard', sans-serif; line-height: 1.6; color: #333; max-width: 600px; margin: 0 auto; padding: 20px; background-color: #fff; }
        h1 { border-bottom: 2px solid #007BFF; padding-bottom: 10px; color: #007BFF; }
        .problem-card { border: 1px solid #eee; padding: 20px; border-radius: 10px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .upload-section { background: #f8f9fa; padding: 20px; border-radius: 10px; text-align: center; }
        input[type="file"] { display: none; }
        .custom-file-upload { display: inline-block; padding: 12px 24px; cursor: pointer; background: #007BFF; color: #fff; border-radius: 5px; font-weight: bold; width: 80%; margin-top: 10px; }
        .submit-btn { background: #28a745; color: white; border: none; padding: 12px 24px; border-radius: 5px; cursor: pointer; width: 80%; font-size: 16px; margin-top: 10px; }
    </style>
</head>
<body>

    <h1>오늘의 수학 과제</h1>

    <div class="problem-card">
        <h3>문제 1.</h3>
        <p>다음 이차방정식의 해를 구하고 풀이 과정을 찍어서 올려주세요.</p>
        <p style="font-size: 1.2em; text-align: center;">\( x^2 - 5x + 6 = 0 \)</p>
    </div>

    <div class="upload-section">
        <p>📷 풀이 사진을 찍어주세요</p>
        <label class="custom-file-upload">
            <input type="file" accept="image/*" capture="camera">
            사진 촬영 / 선택
        </label>
        <button class="submit-btn">과제 제출하기</button>
    </div>

</body>
</html>
