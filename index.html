<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>수학 과제 제출 센터</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.0/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.0/dist/katex.min.js"></script>
    <style>
        body { font-family: 'Pretendard', sans-serif; line-height: 1.6; color: #333; max-width: 500px; margin: 0 auto; padding: 20px; background-color: #fff; }
        h1 { border-bottom: 2px solid #007BFF; padding-bottom: 10px; color: #007BFF; font-size: 1.5rem; }
        .problem-card { border: 1px solid #eee; padding: 15px; border-radius: 10px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        .upload-section { background: #f8f9fa; padding: 20px; border-radius: 10px; text-align: center; }
        .file-label { display: inline-block; padding: 12px 24px; cursor: pointer; background: #007BFF; color: #fff; border-radius: 5px; font-weight: bold; width: 100%; box-sizing: border-box; margin-bottom: 10px; }
        input[type="file"] { display: none; }
        .submit-btn { background: #28a745; color: white; border: none; padding: 15px; border-radius: 5px; cursor: pointer; width: 100%; font-size: 16px; font-weight: bold; }
        .submit-btn:disabled { background: #ccc; cursor: not-allowed; }
        #status { margin-top: 15px; font-weight: bold; color: #007BFF; }
    </style>
</head>
<body>

    <h1>오늘의 수학 과제</h1>

    <div class="problem-card">
        <strong>문제 1.</strong>
        <p>다음 이차방정식의 풀이 과정을 적고 사진을 찍어 제출하세요.</p>
        <p style="font-size: 1.4em; text-align: center;">$$x^2 - 5x + 6 = 0$$</p>
    </div>

    <div class="upload-section">
        <div class="input-group">
            <label for="student-name">이름</label>
            <input type="text" id="student-name" placeholder="이름을 입력하세요">
        </div>

        <label class="file-label">
            <input type="file" id="photo" accept="image/*" capture="camera">
            📷 사진 촬영 / 선택
        </label>
        
        <button class="submit-btn" onclick="uploadData()" id="submit-btn">과제 제출하기</button>
        <div id="status"></div>
    </div>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwFgy_p_zQZPe3E4waNbmBgaqramByCLIlZBD9UnNuMZN7o_uTkneuqwNk2QnO8gh8h/exec"; // <--- 이 부분을 수정하세요!

        function uploadData() {
            const name = document.getElementById('student-name').value;
            const fileInput = document.getElementById('photo');
            const status = document.getElementById('status');
            const btn = document.getElementById('submit-btn');

            if (!name || fileInput.files.length === 0) {
                alert("이름을 입력하고 사진을 찍어주세요.");
                return;
            }

            btn.disabled = true;
            status.innerText = "제출 중... 잠시만 기다려주세요.";

            const file = fileInput.files[0];
            const reader = new FileReader();

            reader.onload = function(e) {
                const base64 = e.target.result.split(',')[1];
                const data = {
                    name: name,
                    base64: base64
                };

                fetch(WEB_APP_URL, {
                    method: "POST",
                    body: JSON.stringify(data)
                })
                .then(response => response.text())
                .then(text => {
                    status.innerText = "✅ " + text;
                    btn.disabled = false;
                    alert("제출이 완료되었습니다!");
                })
                .catch(err => {
                    status.innerText = "❌ 오류 발생. 다시 시도해주세요.";
                    btn.disabled = false;
                    console.error(err);
                });
            };
            reader.readAsDataURL(file);
        }
    </script>
</body>
</html>
