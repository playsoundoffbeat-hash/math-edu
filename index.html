<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>수학 과제 제출 센터</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.0/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.0/dist/katex.min.js"></script>
    <style>
        body { font-family: 'Pretendard', sans-serif; line-height: 1.6; color: #333; max-width: 500px; margin: 0 auto; padding: 20px; background-color: #fff; }
        h1 { border-bottom: 2px solid #007BFF; padding-bottom: 10px; color: #007BFF; font-size: 1.4rem; }
        .problem-card { border: 1px solid #eee; padding: 15px; border-radius: 10px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .input-group { margin-bottom: 15px; }
        input[type="text"] { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        .upload-section { background: #f8f9fa; padding: 20px; border-radius: 10px; text-align: center; }
        .file-label { display: inline-block; padding: 12px; cursor: pointer; background: #007BFF; color: #fff; border-radius: 5px; font-weight: bold; width: 100%; box-sizing: border-box; margin-bottom: 10px; }
        input[type="file"] { display: none; }
        
        #preview-container { margin: 15px 0; display: none; }
        #preview-img { width: 100%; border-radius: 8px; border: 2px solid #007BFF; }
        
        .submit-btn { background: #28a745; color: white; border: none; padding: 15px; border-radius: 5px; cursor: pointer; width: 100%; font-size: 16px; font-weight: bold; margin-top: 10px; }
        .submit-btn:disabled { background: #ccc; cursor: not-allowed; }
        #status { margin-top: 15px; font-weight: bold; word-break: break-all; }
        
        /* 새로 추가된 '다시 제출' 버튼 스타일 */
        .reset-btn { background: #6c757d; color: white; border: none; padding: 12px; border-radius: 5px; cursor: pointer; width: 100%; font-size: 14px; margin-top: 10px; display: none; }
    </style>
</head>
<body>

    <h1>오늘의 수학 과제</h1>

    <div class="problem-card">
        <strong>문제 1.</strong>
        <p>다음 이차방정식의 풀이 과정을 제출하세요.</p>
        <p style="font-size: 1.4em; text-align: center;">\(x^2 - 5x + 6 = 0\)</p>
    </div>

    <div class="upload-section">
        <div class="input-group">
            <input type="text" id="student-name" placeholder="이름을 입력하세요">
        </div>

        <label class="file-label" id="file-label">
            <input type="file" id="photo" accept="image/*" capture="camera" onchange="previewFile()">
            📷 사진 촬영 / 확인
        </label>

        <div id="preview-container">
            <p style="font-size: 0.9rem; color: #666;">선택된 사진 확인:</p>
            <img id="preview-img" src="" alt="미리보기">
        </div>
        
        <button class="submit-btn" onclick="uploadData()" id="submit-btn">과제 제출하기</button>
        <button class="reset-btn" onclick="resetForm()" id="reset-btn">🔄 추가 과제 제출하기</button>
        
        <div id="status"></div>
    </div>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwFgy_p_zQZPe3E4waNbmBgaqramByCLIlZBD9UnNuMZN7o_uTkneuqwNk2QnO8gh8h/exec"; 

        function previewFile() {
            const file = document.getElementById('photo').files[0];
            const preview = document.getElementById('preview-img');
            const container = document.getElementById('preview-container');
            
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    preview.src = e.target.result;
                    container.style.display = 'block';
                }
                reader.readAsDataURL(file);
            }
        }

        // [핵심] 폼 초기화 함수 - 새로고침 없이 다음 제출 준비
        function resetForm() {
            document.getElementById('photo').value = ""; // 파일 선택 초기화
            document.getElementById('preview-img').src = "";
            document.getElementById('preview-container').style.display = 'none';
            document.getElementById('status').innerHTML = "";
            
            const submitBtn = document.getElementById('submit-btn');
            submitBtn.style.display = 'block';
            submitBtn.disabled = false;
            submitBtn.innerText = "과제 제출하기";
            
            document.getElementById('reset-btn').style.display = 'none';
        }

        function uploadData() {
            const name = document.getElementById('student-name').value;
            const fileInput = document.getElementById('photo');
            const status = document.getElementById('status');
            const btn = document.getElementById('submit-btn');
            const resetBtn = document.getElementById('reset-btn');

            if (!name || fileInput.files.length === 0) {
                alert("이름과 사진을 확인해주세요.");
                return;
            }

            btn.disabled = true;
            status.innerHTML = "⏳ 사진 압축 및 전송 중... (최대 10초)";

            const file = fileInput.files[0];
            const reader = new FileReader();

            reader.onload = function(e) {
                const img = new Image();
                img.src = e.target.result;
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    const MAX_WIDTH = 1024;
                    const scaleSize = MAX_WIDTH / img.width;
                    canvas.width = MAX_WIDTH;
                    canvas.height = img.height * scaleSize;

                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    const base64 = canvas.toDataURL('image/jpeg', 0.7).split(',')[1];

                    const data = { name: name, base64: base64 };

                    fetch(WEB_APP_URL, {
                        method: "POST",
                        body: JSON.stringify(data)
                    })
                    .then(response => response.text())
                    .then(text => {
                        status.innerHTML = "✅ 제출 성공!<br><small>다른 사진을 더 보낼 수 있습니다.</small>";
                        btn.style.display = 'none'; // 제출 버튼 숨기기
                        resetBtn.style.display = 'block'; // '추가 제출' 버튼 보이기
                        alert("성공적으로 제출되었습니다!");
                    })
                    .catch(err => {
                        status.innerText = "❌ 오류 발생. 다시 시도해주세요.";
                        btn.disabled = false;
                    });
                };
            };
            reader.readAsDataURL(file);
        }
    </script>
</body>
</html>
